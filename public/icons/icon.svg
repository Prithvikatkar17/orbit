<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#050814" />
      <stop offset="100%" stop-color="#03050c" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="orbitRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Outer Astrolabe Sub-ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(129, 140, 248, 0.15)" stroke-width="1.5" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(212, 175, 55, 0.2)" stroke-width="1" />

  <!-- Elliptical Tilted Orbit Axis -->
  <g transform="rotate(-28 256 256)">
    <ellipse cx="256" cy="256" rx="200" ry="85" fill="none" stroke="url(#orbitRing)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Orbiting Satellite Beacon -->
    <circle cx="456" cy="256" r="7" fill="#00f0ff" filter="url(#glow)" />
    <circle cx="456" cy="256" r="3.5" fill="#ffffff" />
  </g>

  <!-- Central Precision Architectural 'O' Monogram -->
  <!-- Outer O curve -->
  <path
    d="M 256 120
       C 331 120 392 181 392 256
       C 392 331 331 392 256 392
       C 181 392 120 331 120 256
       C 120 181 181 120 256 120 Z
       M 256 170
       C 208.6 170 170 208.6 170 256
       C 170 303.4 208.6 342 256 342
       C 303.4 342 342 303.4 342 256
       C 342 208.6 303.4 170 256 170 Z"
    fill="#f8fafc"
    fill-rule="evenodd"
  />

  <!-- Subtle Core Celestial Starlight Marker -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="18" fill="#03050c" />
    <path
      d="M 0 -14
         Q 0 0 -14 0
         Q 0 0 0 14
         Q 0 0 14 0
         Q 0 0 0 -14 Z"
      fill="#fbbf24"
    />
  </g>

  <!-- Cardinal Tick Marks -->
  <line x1="256" y1="50" x2="256" y2="65" stroke="rgba(212, 175, 55, 0.4)" stroke-width="2" />
  <line x1="256" y1="447" x2="256" y2="462" stroke="rgba(212, 175, 55, 0.4)" stroke-width="2" />
  <line x1="50" y1="256" x2="65" y2="256" stroke="rgba(212, 175, 55, 0.4)" stroke-width="2" />
  <line x1="447" y1="256" x2="462" y2="256" stroke="rgba(212, 175, 55, 0.4)" stroke-width="2" />
</svg>
